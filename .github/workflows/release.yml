name: Release npm package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm release:check
      - name: Verify release tag and package metadata
        run: node scripts/verify-release.mjs "${{ github.event.release.tag_name }}"
        if: github.event_name == 'release'
      - name: Inspect package payload
        run: npm pack --dry-run
      - name: Publish public package with provenance
        run: npm publish --access public --provenance
        if: github.event_name == 'release'
