name: Release npm package

# A pushed tag is the release. Nothing else publishes: a merge to main does not,
# and a manual dispatch runs every gate except the publish and the Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          # The floor npm documents for trusted publishing.
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm release:check

      - name: Resolve release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-identity.mjs >> "$GITHUB_OUTPUT"

      - name: Verify release tag and package metadata
        run: node scripts/verify-release.mjs "${{ steps.release.outputs.tag }}"

      - name: Inspect package payload
        run: npm pack --dry-run

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" "${FLAGS[@]}"

      - name: Publish public package with provenance
        if: github.ref_type == 'tag'
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
