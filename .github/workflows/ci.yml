name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is engines.node; 22.14.0 is what the release job publishes on.
        node-version: ['22.13.0', '22.14.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm token-lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm html-check
      - run: pnpm smoke:install
